<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Gaitsiwe Mathai: cybercore banner">
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F8FF"/><stop offset=".42" stop-color="#9FB4E8"/><stop offset=".5" stop-color="#2E3260"/><stop offset=".68" stop-color="#B9C8F5"/><stop offset="1" stop-color="#E4CCFF"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B44CFF"/><stop offset=".5" stop-color="#00F0FF"/><stop offset="1" stop-color="#B44CFF"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#B44CFF" stroke-opacity=".16"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".28"/></pattern>
<radialGradient id="glow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#B44CFF" stop-opacity=".35"/><stop offset="1" stop-color="#B44CFF" stop-opacity="0"/></radialGradient>
<style>
.mono{font-family:'Courier New',Courier,monospace}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.flow{stroke-dasharray:6 10;animation:f 1.6s linear infinite}@keyframes f{to{stroke-dashoffset:-32}}
.sweep{animation:s 5s linear infinite}@keyframes s{from{transform:translateY(-20px)}to{transform:translateY(280px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="900" height="260" fill="#07060F"/>
<rect width="900" height="260" fill="url(#grid)"/>
<ellipse cx="450" cy="140" rx="380" ry="110" fill="url(#glow)"/>
<g fill="none" stroke="#00F0FF" stroke-opacity=".65" stroke-width="1.5">
<path class="flow" d="M0 205H90V232H210"/><path class="flow" d="M900 55H800V28H700"/>
<path class="flow" d="M0 70H60V46H150"/><path class="flow" d="M900 210H820V235H690"/>
</g>
<g fill="#00F0FF"><rect x="207" y="229" width="6" height="6"/><rect x="147" y="43" width="6" height="6"/><rect x="697" y="25" width="6" height="6"/><rect x="687" y="232" width="6" height="6"/></g>
<rect x="60" y="30" width="780" height="200" fill="#0E0B1F" fill-opacity=".82" stroke="url(#bar)" stroke-width="2"/>
<rect x="60" y="30" width="780" height="26" fill="url(#bar)"/>
<text x="74" y="48" class="mono" font-size="13" font-weight="700" fill="#07060F">gaitsiwe_mathai.exe</text>
<g fill="#07060F"><rect x="772" y="38" width="10" height="10"/><rect x="790" y="38" width="10" height="10"/><rect x="808" y="38" width="10" height="10"/></g>
<text x="450" y="130" text-anchor="middle" class="mono" font-size="52" font-weight="700" letter-spacing="5" fill="url(#chrome)" stroke="#B44CFF" stroke-width=".8" shape-rendering="crispEdges">GAITSIWE MATHAI</text>
<text x="450" y="168" text-anchor="middle" class="mono" font-size="15" letter-spacing="3" fill="#00F0FF">scientific ML // embedded ML // optical + HPC networking</text>
<text x="450" y="200" text-anchor="middle" class="mono" font-size="14" fill="#C9D6FF" fill-opacity=".85">Undergraduate.exe: still compiling<tspan class="blink" fill="#B44CFF">_</tspan></text>
<text x="80" y="218" class="mono" font-size="11" fill="#B44CFF" fill-opacity=".8">Av = λv</text>
<text x="820" y="218" text-anchor="end" class="mono" font-size="11" fill="#B44CFF" fill-opacity=".8">∇θL → 0</text>
<rect width="900" height="260" fill="url(#scan)"/>
<rect class="sweep" x="0" y="0" width="900" height="18" fill="#00F0FF" fill-opacity=".06"/>
</svg>